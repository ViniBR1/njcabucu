<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJ Cabuçu - Igreja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #0D47A1;
            --primary-light: #1565C0;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --shadow: 0 2px 20px rgba(0,0,0,0.06);
            --radius: 16px;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: #1a1a1a;
        }
        .header {
            background: var(--card-bg);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 3px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 1rem; }
        .logo-icon {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.4rem;
            color: white;
        }
        .logo h1 { font-size: 1.5rem; color: var(--primary); }
        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { transform: translateY(-2px); }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; transform: translateY(-2px); }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover { background: var(--primary); color: white; }

        .main-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.3rem;
            background: var(--card-bg);
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #e8e8e8;
            position: sticky;
            top: 75px;
            z-index: 99;
        }
        .nav-btn {
            background: transparent;
            border: 2px solid transparent;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            color: #1a1a1a;
        }
        .nav-btn:hover { background: var(--primary); color: white; transform: translateY(-2px); }
        .nav-btn.active { background: var(--primary); color: white; }

        .carousel-container {
            position: relative;
            max-width: 1400px;
            margin: 1.5rem auto;
            overflow: hidden;
            border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .carousel-wrapper {
            display: flex;
            transition: transform 0.6s ease;
        }
        .carousel-slide {
            min-width: 100%;
            position: relative;
            height: 420px;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .carousel-slide::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }
        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            color: white;
            padding: 2.5rem;
            z-index: 1;
        }
        .carousel-caption h3 { font-size: 2.2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .carousel-caption p { font-size: 1.1rem; opacity: 0.9; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-btn:hover { background: var(--primary); color: white; }
        .carousel-btn.prev { left: 15px; }
        .carousel-btn.next { right: 15px; }
        .carousel-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.8rem;
            z-index: 2;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dot.active { background: var(--primary); transform: scale(1.2); }

        .section {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            scroll-margin-top: 130px;
        }
        .section-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: var(--primary);
            margin: 0.5rem auto 0;
            border-radius: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid #e8e8e8;
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 0.8rem;
        }
        .card h3 { color: var(--primary); margin-bottom: 0.5rem; }
        .card .price { font-size: 1.3rem; font-weight: 700; color: var(--primary); margin: 0.5rem 0; }
        .card .btn { width: 100%; justify-content: center; }

        .bible-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .bible-input { flex: 1; min-width: 250px; }
        .bible-input select, .bible-input input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.3rem 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
        }
        .bible-result {
            flex: 2;
            min-width: 300px;
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: var(--radius);
            max-height: 400px;
            overflow-y: auto;
        }
        .bible-result .verse { font-size: 1.05rem; line-height: 1.8; padding: 0.3rem 0; border-bottom: 1px solid #eee; }
        .bible-result .reference { font-weight: 700; color: var(--primary); margin-top: 0.5rem; }

        .form-group { margin: 0.8rem 0; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.95rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
            background: white;
        }
        .prayer-form { max-width: 600px; margin: 0 auto; }
        .prayer-form textarea { min-height: 120px; resize: vertical; }

        .tithe-options {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .btn-donation {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
        }
        .btn-donation:hover { background: var(--primary-light); transform: translateY(-3px) scale(1.03); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            max-width: 520px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-close {
            float: right;
            cursor: pointer;
            font-size: 1.5rem;
            color: #888;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #333; transform: rotate(90deg); }
        .modal-content .btn { width: 100%; justify-content: center; }
        .modal-content .form-row { display: flex; gap: 1rem; }
        .modal-content .form-row > * { flex: 1; }

        .footer {
            background: #1a1a2e;
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            margin-top: 2.5rem;
            border-top: 4px solid var(--primary);
        }
        .footer .social-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 1rem;
        }
        .footer .social-links a {
            color: white;
            font-size: 1.6rem;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            text-decoration: none;
        }
        .footer .social-links a:hover { background: var(--primary); transform: translateY(-5px); }

        .notification {
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            margin: 0.8rem 0;
            font-weight: 500;
            position: fixed;
            top: 20px;
            right: 20px;
            max-width: 400px;
            z-index: 99999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            animation: modalIn 0.3s ease;
        }
        .notification.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .notification.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .notification.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        .text-center { text-align: center; }
        .mt-1 { margin-top: 0.8rem; }
        .mt-2 { margin-top: 1.5rem; }
        .hidden { display: none !important; }
        .w-full { width: 100%; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 0.5rem; padding: 0.8rem 1rem; }
            .main-nav { top: 110px; gap: 0.2rem; padding: 0.4rem 0.5rem; }
            .main-nav .nav-btn { padding: 0.3rem 0.8rem; font-size: 0.75rem; }
            .carousel-slide { height: 220px; }
            .carousel-caption { padding: 1.5rem; }
            .carousel-caption h3 { font-size: 1.3rem; }
            .section { padding: 1rem; margin: 1rem; }
            .bible-container { flex-direction: column; }
            .modal-content .form-row { flex-direction: column; }
            .tithe-options { gap: 0.8rem; }
            .btn-donation { padding: 0.8rem 1.5rem; font-size: 1rem; }
        }
    </style>
</head>
