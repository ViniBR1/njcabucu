<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login - NJ Cabuçu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #0D47A1;
            --primary-light: #1565C0;
            --primary-gradient: linear-gradient(135deg, #0D47A1, #1565C0);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 50px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            font-family: var(--font);
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: radial-gradient(circle at 10% 20%, rgba(13,71,161,0.05) 0%, transparent 50%);
        }
        .login-container {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 8px 24px rgba(13,71,161,0.2);
            overflow: hidden;
            border: 3px solid #fff;
            position: relative;
        }
        .login-header .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .login-header .logo .logo-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #bbb;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }
        .login-header p {
            color: #888;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }
        .login-header .sub {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 0.1rem;
        }

        .form-group {
            margin: 0.8rem 0;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: #333;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font);
            transition: var(--transition);
            background: #fafbff;
        }
        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(13,71,161,0.08);
        }
        .form-group .input-icon {
            position: relative;
        }
        .form-group .input-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 0.9rem;
        }
        .form-group .input-icon input {
            padding-left: 2.5rem;
        }

        .info-box {
            background: #e3f2fd;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            margin: 0.8rem 0;
            font-size: 0.8rem;
            color: #0d47a1;
            text-align: center;
            border-left: 3px solid var(--primary);
        }
        .info-box strong { display: block; margin-bottom: 0.2rem; }

        .btn {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(13,71,161,0.2);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(13,71,161,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #28a745;
            color: #fff;
            box-shadow: 0 4px 16px rgba(40,167,69,0.2);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(40,167,69,0.3);
        }

        .text-center { text-align: center; }
        .mt-1 { margin-top: 0.8rem; }
        .hidden { display: none !important; }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            border: 1px solid #f5c6cb;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            border: 1px solid #c3e6cb;
        }

        .toggle-link {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
        }
        .toggle-link:hover { color: var(--primary-light); text-decoration: underline; }
        .divider { margin: 0 0.5rem; color: #ccc; }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            background: none;
            border: none;
            font-size: 0.9rem;
            padding: 0.2rem;
        }
        .password-toggle:hover { color: #333; }

        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            .login-container { padding: 1.8rem 1.2rem; border-radius: var(--radius-sm); }
            .login-header h1 { font-size: 1.2rem; }
            .login-header .logo { width: 68px; height: 68px; font-size: 1.5rem; }
            .form-group input { font-size: 0.85rem; padding: 0.6rem 0.8rem; }
            .form-group .input-icon input { padding-left: 2.2rem; }
            .btn { font-size: 0.85rem; padding: 0.6rem; }
            .info-box { font-size: 0.7rem; padding: 0.6rem; }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            .login-container { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo" id="loginLogo">
                <span class="logo-skeleton">NJ</span>
            </div>
            <h1>NJ Cabuçu</h1>
            <p>Área Interna</p>
            <div class="sub">Igreja Nova Jerusalém</div>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <div id="loginForm">
            <div class="info-box">
                <strong>👑 Credenciais do Pastor:</strong>
                Email: pastor@njcabucu.com<br>
                Senha: admin123
            </div>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> E-mail</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" value="pastor@njcabucu.com" placeholder="Seu e-mail" autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Senha</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" value="admin123" placeholder="Sua senha" autocomplete="current-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="loginError" class="error-message hidden"></div>
            <div id="loginSuccess" class="success-message hidden"></div>

            <button onclick="login()" class="btn btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>

            <div class="text-center mt-1">
                <span class="toggle-link" onclick="showChangePassword()">
                    <i class="fas fa-key"></i> Esqueceu a senha?
                </span>
                <span class="divider">|</span>
                <a href="/" class="toggle-link">
                    <i class="fas fa-home"></i> Voltar ao site
                </a>
            </div>
        </div>

        <!-- ===== CHANGE PASSWORD FORM ===== -->
        <div id="changePasswordForm" class="hidden">
            <h3 style="text-align:center;font-size:1.1rem;color:var(--primary);margin-bottom:0.8rem;">
                <i class="fas fa-key"></i> Alterar Senha
            </h3>

            <div class="form-group">
                <label><i class="fas fa-envelope"></i> E-mail</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="changeEmail" value="pastor@njcabucu.com" placeholder="Seu e-mail">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Senha Atual</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="changeCurrentPassword" placeholder="Deixe em branco se for primeiro acesso">
                    <button type="button" class="password-toggle" onclick="togglePassword('changeCurrentPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Nova Senha</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="changeNewPassword" placeholder="Mínimo 6 caracteres">
                    <button type="button" class="password-toggle" onclick="togglePassword('changeNewPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-check-circle"></i> Confirmar</label>
                <div class="input-icon">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="changeConfirmPassword" placeholder="Digite novamente">
                    <button type="button" class="password-toggle" onclick="togglePassword('changeConfirmPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="changeError" class="error-message hidden"></div>
            <div id="changeMessage" class="success-message hidden"></div>

            <button onclick="changePassword()" class="btn btn-success" id="changeBtn">
                <i class="fas fa-save"></i> Alterar Senha
            </button>

            <div class="text-center mt-1">
                <span class="toggle-link" onclick="showLogin()">
                    <i class="fas fa-arrow-left"></i> Voltar ao login
                </span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        // ============================================
        // CARREGAR LOGO + FAVICON DINÂMICOS
        // ============================================
        async function loadLoginLogo() {
            const logoEl = document.getElementById('loginLogo');
            try {
                const res = await fetch('/api/settings', { cache: 'no-store' });
                if (!res.ok) throw new Error('Erro ao buscar settings');
                const data = await res.json();

                if (data.site_logo) {
                    // 1) Atualiza a logo grande
                    const img = document.createElement('img');
                    img.src = data.site_logo;
                    img.alt = 'Logo NJ Cabuçu';
                    img.onload = () => {
                        logoEl.innerHTML = '';
                        logoEl.appendChild(img);
                        logoEl.style.background = '#fff';
                        logoEl.style.border = '3px solid #e0e0e0';
                    };
                    img.onerror = () => {
                        logoEl.innerHTML = 'NJ';
                    };

                    // 2) Atualiza o favicon (ícone da aba)
                    updateFavicon(data.site_logo);

                    // 3) Atualiza o título da aba com o nome da igreja (se tiver)
                    if (data.site_title) {
                        document.title = 'Login - ' + data.site_title;
                    }
                } else {
                    // Sem logo personalizada → mantém NJ padrão
                    logoEl.innerHTML = 'NJ';

                    // Favicon padrão (um "N" em SVG azul)
                    updateFavicon(null);
                }
            } catch (err) {
                console.warn('⚠️ Não foi possível carregar a logo:', err.message);
                logoEl.innerHTML = 'NJ';
                updateFavicon(null);
            }
        }

        // ============================================
        // FUNÇÃO PARA ATUALIZAR O FAVICON
        // ============================================
        function updateFavicon(imageUrl) {
            // Remove favicons existentes
            const existingIcons = document.querySelectorAll("link[rel*='icon']");
            existingIcons.forEach(el => el.remove());

            // Se tem imagem, usa ela
            if (imageUrl) {
                const link = document.createElement('link');
                link.rel = 'icon';
                link.type = 'image/png';
                link.href = imageUrl;
                document.head.appendChild(link);

                // Adiciona também como apple-touch-icon (iPhone)
                const appleIcon = document.createElement('link');
                appleIcon.rel = 'apple-touch-icon';
                appleIcon.href = imageUrl;
                document.head.appendChild(appleIcon);

                // Adiciona como shortcut icon (fallback)
                const shortcut = document.createElement('link');
                shortcut.rel = 'shortcut icon';
                shortcut.href = imageUrl;
                document.head.appendChild(shortcut);
            } else {
                // Favicon padrão: SVG com "NJ" em círculo azul
                const svg = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#0D47A1"/>
                                <stop offset="100%" style="stop-color:#1565C0"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="48" fill="url(#g)"/>
                        <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
                              fill="#fff" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="42">
                            NJ
                        </text>
                    </svg>
                `.trim();

                const dataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));

                const link = document.createElement('link');
                link.rel = 'icon';
                link.type = 'image/svg+xml';
                link.href = dataUrl;
                document.head.appendChild(link);
            }
        }

        // ============================================
        // UTILITÁRIOS
        // ============================================
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = field.parentElement.querySelector('.password-toggle');
            const icon = btn.querySelector('i');
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('changePasswordForm').classList.add('hidden');
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('loginSuccess').classList.add('hidden');
        }

        function showChangePassword() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('changePasswordForm').classList.remove('hidden');
            document.getElementById('changeError').classList.add('hidden');
            document.getElementById('changeMessage').classList.add('hidden');
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function showSuccess(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        // ============================================
        // LOGIN
        // ============================================
        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (!email || !password) {
                showError('loginError', '⚠️ Preencha todos os campos!');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Entrando...';

            try {
                const response = await fetch(API_URL + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Erro no login');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                if (data.user.first_login) {
                    showSuccess('loginSuccess', '🔐 Primeiro acesso! Altere sua senha.');
                    document.getElementById('changeEmail').value = email;
                    setTimeout(() => showChangePassword(), 1000);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
                    return;
                }

                const redirect = data.user.role === 'pastor' ? '/admin' : '/departamento';
                window.location.href = redirect;

            } catch (error) {
                showError('loginError', '❌ ' + error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
            }
        }

        // ============================================
        // ALTERAR SENHA
        // ============================================
        async function changePassword() {
            const email = document.getElementById('changeEmail').value.trim();
            const currentPassword = document.getElementById('changeCurrentPassword').value;
            const newPassword = document.getElementById('changeNewPassword').value;
            const confirmPassword = document.getElementById('changeConfirmPassword').value;
            const errorDiv = document.getElementById('changeError');
            const messageDiv = document.getElementById('changeMessage');
            const changeBtn = document.getElementById('changeBtn');

            errorDiv.classList.add('hidden');
            messageDiv.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                showError('changeError', '❌ As senhas não coincidem');
                return;
            }
            if (newPassword.length < 6) {
                showError('changeError', '❌ Mínimo 6 caracteres');
                return;
            }

            changeBtn.disabled = true;
            changeBtn.innerHTML = '<span class="spinner"></span> Alterando...';

            try {
                const response = await fetch(API_URL + '/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, currentPassword, newPassword })
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Erro ao alterar senha');

                showSuccess('changeMessage', '✅ ' + data.message);
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } catch (error) {
                showError('changeError', '❌ ' + error.message);
                changeBtn.disabled = false;
                changeBtn.innerHTML = '<i class="fas fa-save"></i> Alterar Senha';
            }
        }

        // ============================================
        // ENTER KEY + INICIALIZAÇÃO
        // ============================================
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (!document.getElementById('loginForm').classList.contains('hidden')) {
                    login();
                } else if (!document.getElementById('changePasswordForm').classList.contains('hidden')) {
                    changePassword();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // 1) Carrega a logo + favicon primeiro
            loadLoginLogo();

            // 2) Se já estiver logado, redireciona
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (token && user) {
                if (user.role === 'pastor') {
                    window.location.href = '/admin';
                } else if (user.department_id) {
                    window.location.href = '/departamento';
                }
            }
        });
    </script>
</body>
</html>
