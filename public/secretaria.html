<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secretaria - NJ Cabuçu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #0D47A1;
            --primary-light: #1565C0;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --radius: 16px;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: #1a1a1a;
        }
        .header {
            background: var(--card-bg);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            flex-wrap: wrap;
        }
        .logo { display: flex; align-items: center; gap: 0.8rem; }
        .logo-icon { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem; color: white; }
        .logo h1 { font-size: 1.3rem; color: var(--primary); }
        .btn {
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
        .container { max-width: 1400px; margin: 1.5rem auto; padding: 0 1.5rem; }

        .tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 0.6rem;
            border-radius: 12px;
            border: 1px solid #e8e8e8;
        }
        .tab-btn {
            padding: 0.4rem 1rem;
            border: 2px solid transparent;
            border-radius: 50px;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.8rem;
        }
        .tab-btn:hover { border-color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid #e8e8e8;
        }
        .tab-content.active { display: block; }

        .table-wrapper { overflow-x: auto; }
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .table th { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 2px solid #e8e8e8; color: #666; }
        .table td { padding: 0.4rem 0.5rem; border-bottom: 1px solid #f0f0f0; }
        .table tr:hover { background: #f8f9fa; }

        .status {
            padding: 0.1rem 0.5rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-approved { background: #d4edda; color: #155724; }

        .form-group { margin: 0.8rem 0; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.2rem; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }
        .form-row { display: flex; gap: 1rem; }
        .form-row > * { flex: 1; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: var(--radius);
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-close { float: right; cursor: pointer; font-size: 1.5rem; color: #888; background: none; border: none; }
        .modal-close:hover { color: #333; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .mt-1 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 1rem; }
        .hidden { display: none !important; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            font-weight: 500;
            z-index: 99999;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            animation: modalIn 0.3s ease;
        }
        .notification.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .notification.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .notification.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 0.5rem; padding: 0.8rem 1rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">NJ</div>
        <h1>Secretaria</h1>
    </div>
    <div>
        <span style="margin-right:0.8rem;color:#666;font-weight:600;">👤 Secretário</span>
        <button onclick="logout()" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('frequencia')"><i class="fas fa-calendar-check"></i> Frequência</button>
        <button class="tab-btn" onclick="showTab('tesouraria')"><i class="fas fa-hand-holding-heart"></i> Tesouraria</button>
        <button class="tab-btn" onclick="showTab('contas')"><i class="fas fa-receipt"></i> Contas</button>
        <button class="tab-btn" onclick="showTab('membros')"><i class="fas fa-users"></i> Membros</button>
    </div>

    <!-- FREQUÊNCIA -->
    <div id="tab-frequencia" class="tab-content active">
        <h3>📅 Frequência</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Membro</label>
                <select id="attendanceMember"></select>
            </div>
            <div class="form-group">
                <label>Data</label>
                <input type="date" id="attendanceDate">
            </div>
            <div class="form-group">
                <label>Culto</label>
                <select id="attendanceService">
                    <option value="domingo">Domingo</option>
                    <option value="quarta">Quarta</option>
                    <option value="sabado">Sábado</option>
                    <option value="especial">Especial</option>
                </select>
            </div>
        </div>
        <button onclick="registerAttendance()" class="btn btn-primary"><i class="fas fa-check"></i> Registrar Presença</button>
        <div id="attendanceList" class="mt-1"></div>
    </div>

    <!-- TESOURARIA -->
    <div id="tab-tesouraria" class="tab-content">
        <div class="flex-between mb-1">
            <h3>💝 Dízimos e Ofertas</h3>
            <button onclick="openTitheModal()" class="btn btn-success"><i class="fas fa-plus"></i> Registrar</button>
        </div>
        <div id="titheSummary" class="mb-1"></div>
        <div class="table-wrapper">
            <table class="table">
                <thead><tr><th>Membro</th><th>Tipo</th><th>Valor</th><th>Data</th><th>Método</th></tr></thead>
                <tbody id="tithesList"></tbody>
            </table>
        </div>
    </div>

    <!-- CONTAS -->
    <div id="tab-contas" class="tab-content">
        <div class="flex-between mb-1">
            <h3>📋 Contas a Pagar</h3>
            <button onclick="openBillModal()" class="btn btn-success"><i class="fas fa-plus"></i> Nova Conta</button>
            <div id="billSummary"></div>
        </div>
        <div class="table-wrapper">
            <table class="table">
                <thead><tr><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody id="billsList"></tbody>
            </table>
        </div>
    </div>

    <!-- MEMBROS (VISUALIZAÇÃO) -->
    <div id="tab-membros" class="tab-content">
        <h3>👥 Membros</h3>
        <div class="table-wrapper">
            <table class="table">
                <thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Departamento</th></tr></thead>
                <tbody id="membersList"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL DÍZIMO -->
<div class="modal" id="titheModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal('titheModal')">&times;</button>
        <h3>💝 Registrar Dízimo/Oferta</h3>
        <div class="form-group"><label>Membro</label>
            <select id="titheMember"><option value="">Visitante</option></select>
        </div>
        <div class="form-group"><label>Nome (se visitante)</label><input type="text" id="titheName"></div>
        <div class="form-row">
            <div class="form-group"><label>Tipo *</label>
                <select id="titheType">
                    <option value="dizimo">Dízimo</option>
                    <option value="oferta">Oferta</option>
                    <option value="missoes">Missões</option>
                </select>
            </div>
            <div class="form-group"><label>Valor *</label><input type="number" id="titheAmount" step="0.01" min="0.01"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Data</label><input type="date" id="titheDate"></div>
            <div class="form-group"><label>Método</label>
                <select id="titheMethod">
                    <option value="dinheiro">Dinheiro</option>
                    <option value="pix">PIX</option>
                    <option value="cartao">Cartão</option>
                    <option value="transferencia">Transferência</option>
                </select>
            </div>
        </div>
        <div class="form-group"><label>Descrição</label><input type="text" id="titheDescription"></div>
        <button onclick="saveTithe()" class="btn btn-primary w-full" style="justify-content:center;"><i class="fas fa-save"></i> Salvar</button>
    </div>
</div>

<!-- MODAL CONTA -->
<div class="modal" id="billModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal('billModal')">&times;</button>
        <h3>📋 Nova Conta</h3>
        <div class="form-group"><label>Descrição *</label><input type="text" id="billDescription"></div>
        <div class="form-row">
            <div class="form-group"><label>Categoria *</label>
                <select id="billCategory">
                    <option value="agua">Água</option>
                    <option value="luz">Luz</option>
                    <option value="internet">Internet</option>
                    <option value="aluguel">Aluguel</option>
                    <option value="material">Material</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            <div class="form-group"><label>Valor *</label><input type="number" id="billAmount" step="0.01" min="0.01"></div>
        </div>
        <div class="form-group"><label>Data de Vencimento *</label><input type="date" id="billDueDate"></div>
        <div class="form-group"><label>Observações</label><textarea id="billNotes" rows="3"></textarea></div>
        <button onclick="saveBill()" class="btn btn-primary w-full" style="justify-content:center;"><i class="fas fa-save"></i> Salvar</button>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/login'; }

function getHeaders() {
    return { 'Authorization': 'Bearer ' + token };
}

function showNotification(message, type = 'info') {
    const div = document.createElement('div');
    div.className = 'notification ' + type;
    div.textContent = message;
    document.body.appendChild(div);
    setTimeout(() => {
        div.style.opacity = '0';
        div.style.transition = 'opacity 0.5s';
        setTimeout(() => div.remove(), 500);
    }, 4000);
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', (e) => { if (e.target === m) closeModal(m.id); });
});

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/login';
}

function showTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => {
        const map = {
            'frequencia': 'Frequência',
            'tesouraria': 'Tesouraria',
            'contas': 'Contas',
            'membros': 'Membros'
        };
        if (b.textContent.includes(map[tab])) b.classList.add('active');
    });
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'frequencia') { loadAttendanceMembers(); loadAttendance(); }
    if (tab === 'tesouraria') { loadTithes(); loadTitheSummary(); }
    if (tab === 'contas') { loadBills(); loadBillSummary(); }
    if (tab === 'membros') { loadMembers(); }
}

// ============================================
// ===== MEMBROS =====
// ============================================

async function loadMembers() {
    try {
        const res = await fetch('/api/members', { headers: getHeaders() });
        const data = await res.json();
        const tbody = document.getElementById('membersList');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="color:#888;">Nenhum membro cadastrado</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(m => `
            <tr>
                <td>${m.name}</td>
                <td>${m.email || '-'}</td>
                <td>${m.phone || '-'}</td>
                <td>${m.department_name || '-'}</td>
            </tr>
        `).join('');
    } catch (e) { console.error('Erro:', e); }
}

// ============================================
// ===== FREQUÊNCIA =====
// ============================================

async function loadAttendanceMembers() {
    try {
        const res = await fetch('/api/members', { headers: getHeaders() });
        const data = await res.json();
        const select = document.getElementById('attendanceMember');
        select.innerHTML = '<option value="">Selecione</option>' + 
            data.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    } catch (e) { console.error('Erro:', e); }
}

async function registerAttendance() {
    const member_id = document.getElementById('attendanceMember').value;
    const event_date = document.getElementById('attendanceDate').value;
    const service_type = document.getElementById('attendanceService').value;

    if (!member_id || !event_date) {
        showNotification('Selecione membro e data!', 'error');
        return;
    }

    try {
        await fetch('/api/attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getHeaders() },
            body: JSON.stringify({ member_id, event_date, service_type, present: true })
        });
        showNotification('✅ Presença registrada!', 'success');
        loadAttendance();
    } catch (e) { showNotification('❌ Erro: ' + e.message, 'error'); }
}

async function loadAttendance() {
    try {
        const member_id = document.getElementById('attendanceMember').value;
        if (!member_id) {
            document.getElementById('attendanceList').innerHTML = '<p style="color:#888;">Selecione um membro para ver a frequência.</p>';
            return;
        }
        const res = await fetch('/api/attendance/' + member_id + '?limit=10', { headers: getHeaders() });
        const data = await res.json();
        
        const stats = await fetch('/api/attendance/stats/' + member_id, { headers: getHeaders() }).then(r => r.json());
        
        let html = `<div style="background:#f8f9fa;padding:0.8rem;border-radius:8px;margin-bottom:0.8rem;">
            <strong>📊 Estatísticas:</strong>
            Total: ${stats.total || 0} | 
            ✅ Presente: ${stats.present || 0} | 
            ❌ Falta: ${stats.absent || 0} | 
            🎯 ${stats.percentage || 0}%
        </div>`;
        
        if (data.length === 0) {
            html += '<p style="color:#888;">Nenhum registro de frequência.</p>';
        } else {
            html += '<div class="table-wrapper"><table class="table"><thead><tr><th>Data</th><th>Culto</th><th>Status</th></tr></thead><tbody>';
            data.forEach(a => {
                html += `<tr>
                    <td>${new Date(a.event_date).toLocaleDateString('pt-BR')}</td>
                    <td>${a.service_type}</td>
                    <td>${a.present ? '✅ Presente' : '❌ Falta'}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
        }
        document.getElementById('attendanceList').innerHTML = html;
    } catch (e) { console.error('Erro:', e); }
}

document.getElementById('attendanceMember')?.addEventListener('change', loadAttendance);

// ============================================
// ===== DÍZIMOS =====
// ============================================

async function openTitheModal() {
    try {
        const members = await fetch('/api/members', { headers: getHeaders() }).then(r => r.json());
        const select = document.getElementById('titheMember');
        select.innerHTML = '<option value="">Visitante</option>' + 
            members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        
        document.getElementById('titheName').value = '';
        document.getElementById('titheAmount').value = '';
        document.getElementById('titheDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('titheType').value = 'dizimo';
        document.getElementById('titheMethod').value = 'dinheiro';
        document.getElementById('titheDescription').value = '';
        openModal('titheModal');
    } catch (e) { showNotification('❌ Erro: ' + e.message, 'error'); }
}

async function saveTithe() {
    const member_id = document.getElementById('titheMember').value;
    const member_name = document.getElementById('titheName').value.trim();
    const type = document.getElementById('titheType').value;
    const amount = parseFloat(document.getElementById('titheAmount').value);
    const payment_date = document.getElementById('titheDate').value;
    const payment_method = document.getElementById('titheMethod').value;
    const description = document.getElementById('titheDescription').value.trim();

    if (!amount || amount <= 0) {
        showNotification('Digite um valor válido!', 'error');
        return;
    }

    try {
        await fetch('/api/tithes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getHeaders() },
            body: JSON.stringify({ 
                member_id: member_id || null, 
                member_name: member_name || null,
                type, 
                amount, 
                payment_date: payment_date || new Date().toISOString().split('T')[0],
                payment_method, 
                description 
            })
        });
        closeModal('titheModal');
        loadTithes();
        loadTitheSummary();
        showNotification('✅ Registrado com sucesso!', 'success');
    } catch (e) { showNotification('❌ Erro: ' + e.message, 'error'); }
}

async function loadTithes() {
    try {
        const res = await fetch('/api/tithes', { headers: getHeaders() });
        const data = await res.json();
        const tbody = document.getElementById('tithesList');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="color:#888;">Nenhum registro</td></tr>';
            return;
        }
        tbody.innerHTML = data.slice(0, 30).map(t => `
            <tr>
                <td>${t.member_name || 'Visitante'}</td>
                <td>${t.type}</td>
                <td>R$ ${parseFloat(t.amount).toFixed(2)}</td>
                <td>${new Date(t.payment_date).toLocaleDateString('pt-BR')}</td>
                <td>${t.payment_method}</td>
            </tr>
        `).join('');
    } catch (e) { console.error('Erro:', e); }
}

async function loadTitheSummary() {
    try {
        const res = await fetch('/api/tithes/summary', { headers: getHeaders() });
        const data = await res.json();
        const div = document.getElementById('titheSummary');
        if (!data.by_type || data.by_type.length === 0) {
            div.innerHTML = '<p style="color:#888;font-size:0.9rem;">Nenhum registro</p>';
            return;
        }
        let html = '<div style="display:flex;gap:1rem;flex-wrap:wrap;font-size:0.9rem;">';
        data.by_type.forEach(t => {
            html += `<span><strong>${t.type}:</strong> R$ ${parseFloat(t.total).toFixed(2)} (${t.count})</span>`;
        });
        html += `<span><strong>Total:</strong> R$ ${parseFloat(data.total).toFixed(2)}</span>`;
        html += '</div>';
        div.innerHTML = html;
    } catch (e) { console.error('Erro:', e); }
}

// ============================================
// ===== CONTAS =====
// ============================================

function openBillModal() {
    document.getElementById('billDescription').value = '';
    document.getElementById('billCategory').value = 'agua';
    document.getElementById('billAmount').value = '';
    document.getElementById('billDueDate').value = '';
    document.getElementById('billNotes').value = '';
    openModal('billModal');
}

async function saveBill() {
    const description = document.getElementById('billDescription').value.trim();
    const category = document.getElementById('billCategory').value;
    const amount = parseFloat(document.getElementById('billAmount').value);
    const due_date = document.getElementById('billDueDate').value;
    const notes = document.getElementById('billNotes').value.trim();

    if (!description || !amount || !due_date) {
        showNotification('Preencha todos os campos obrigatórios!', 'error');
        return;
    }

    try {
        await fetch('/api/bills', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getHeaders() },
            body: JSON.stringify({ description, category, amount, due_date, notes })
        });
        closeModal('billModal');
        loadBills();
        loadBillSummary();
        showNotification('✅ Conta criada!', 'success');
    } catch (e) { showNotification('❌ Erro: ' + e.message, 'error'); }
}

async function loadBills() {
    try {
        const res = await fetch('/api/bills', { headers: getHeaders() });
        const data = await res.json();
        const tbody = document.getElementById('billsList');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center" style="color:#888;">Nenhuma conta</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(b => `
            <tr>
                <td>${b.description}</td>
                <td>${b.category}</td>
                <td>R$ ${parseFloat(b.amount).toFixed(2)}</td>
                <td>${new Date(b.due_date).toLocaleDateString('pt-BR')}</td>
                <td><span class="status ${b.paid ? 'status-approved' : 'status-pending'}">${b.paid ? '✅ Pago' : '⏳ Pendente'}</span></td>
                <td>
                    ${!b.paid ? `<button onclick="payBill(${b.id})" class="btn btn-success btn-sm"><i class="fas fa-check"></i> Pagar</button>` : ''}
                    <button onclick="deleteBill(${b.id})" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');
    } catch (e) { console.error('Erro:', e); }
}

async function payBill(id) {
    if (!confirm('Marcar esta conta como paga?')) return;
    try {
        await fetch('/api/bills/' + id + '/pay', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', ...getHeaders() },
            body: JSON.stringify({ payment_date: new Date().toISOString().split('T')[0], payment_method: 'dinheiro' })
        });
        loadBills();
        loadBillSummary();
        showNotification('✅ Conta paga!', 'success');
    } catch (e) { showNotification('❌ Erro: ' + e.message, 'error'); }
}

async function deleteBill(id) {
    if (!confirm('Remover esta conta?')) return;
    try {
        await fetch('/api/bills/' + id, { method: 'DELETE', headers: getHeaders() });
        loadBills();
        loadBillSummary();
        showNotification('✅ Conta removida!', 'success');
    } catch (e) { showNotification('❌ Erro: ' + e.message, 'error'); }
}

async function loadBillSummary() {
    try {
        const res = await fetch('/api/bills/summary', { headers: getHeaders() });
        const data = await res.json();
        const div = document.getElementById('billSummary');
        if (!data.summary) {
            div.innerHTML = '<p style="color:#888;font-size:0.9rem;">Nenhuma conta</p>';
            return;
        }
        div.innerHTML = `
            <div style="display:flex;gap:1rem;flex-wrap:wrap;font-size:0.9rem;">
                <span><strong>Total:</strong> ${data.summary.total || 0}</span>
                <span style="color:#dc3545;"><strong>⏳ Pendentes:</strong> R$ ${parseFloat(data.summary.pending || 0).toFixed(2)}</span>
                <span style="color:#28a745;"><strong>✅ Pagas:</strong> R$ ${parseFloat(data.summary.paid_total || 0).toFixed(2)}</span>
            </div>
        `;
    } catch (e) { console.error('Erro:', e); }
}

// ============================================
// ===== INICIALIZAÇÃO =====
// ============================================

document.addEventListener('DOMContentLoaded', () => {
    loadMembers();
    loadAttendanceMembers();
    loadTithes();
    loadTitheSummary();
    loadBills();
    loadBillSummary();
});
</script>
